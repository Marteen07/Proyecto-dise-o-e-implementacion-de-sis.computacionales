<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear usuario-Aerolíneas Malvinas</title>
    <link rel="stylesheet" href="Styles.css">
</head>
<body class="cuerpo">
    <header class="header">
        <div class="header-izq">
            <h1 class="titulo">Aerolíneas Malvinas</h1>
        </div>
        <div class="header-cen">
            <h2>Los mejores envíos del país</h2>
        </div>
        <div class="header-der">
            <a href="Administrar usuarios.html" class="boton">Volver</a>
        </div>        
    </header>
<br>
<br>
<main>
    <div class="container">
        <h2>Crear usuario</h2>
        
        <form>
    <div>
        <label for="id-usuario">ID del usuario:</label>
        <input type="number" id="id-usuario" name="id-usuario" required>
    <br>
    <br>
    <label for="nom-usuario">Nombre del usuario:</label>
    <input type="text" id="nom-usuario" name="nom-usuario"required>
    </div>
    <br>
    <div>
    <label for="ap-usuario">Apellido del usuario:</label>
    <input type="text" id="ap-usuario" name="ap-usuario"required>
    </div>
    <br>
    <div>
    <label for="Cuit">Cuit:</label>
    <input type="number" id="Cuit" name="Cuit"required>
    </div>
    <br>
    <div>
    <label for="id-usuario">Rol del usuario:</label>
        <select id="rol-usuario" name="rol-usuario" required>
        <option value=""></option>
        <option value="Admin">Admin</option>
        <option value="Superior">Superior</option>
        <option value="Empleado">Empleado</option>
        </select>
    </div>
    <br>
    <br>
    <div class="drop-zone" id="drop-zone">
        <div class="drop-zone-icon">📄</div>
        <p class="drop-zone-text">Clickea y subí el Documento acá</p>
        <input type="file" id="file-input" name="informe_pdf" accept=".pdf,.doc,.docx" hidden required>
        <div id="file-name" class="file-name"></div> 
    </div>
    <br>
     <button type="submit">Crear usuario</button>

    <style>
    .drop-zone {
    border: 2px dashed #0056b3;
    border-radius: 12px;
    padding: 35px 20px;
    text-align: center;
    background-color: #f8f9fa;
    cursor: pointer;
    transition: all 0.3s ease;
    max-width: 500px;
    margin: 20px auto;
  }

  .drop-zone-icon {
    font-size: 40px;
    margin-bottom: 10px;
  }

  .drop-zone-text {
    font-weight: bold;
    font-size: 16px;
    color: #333;
    margin: 0 0 5px 0;
  }

  .file-name {
    margin-top: 15px;
    font-weight: bold;
    color: #28a745;
    font-size: 14px;
  }
</style>

<script>
  const dropZone = document.getElementById('drop-zone');
  const fileInput = document.getElementById('file-input');
  const fileNameDisplay = document.getElementById('file-name');

  // Abrir selector al hacer clic
  dropZone.addEventListener('click', () => fileInput.click());

  ['dragleave', 'drop'].forEach(eventName => {
    dropZone.addEventListener(eventName, (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
    });
  });
  // Manejar el soltado de archivo (drop)
  dropZone.addEventListener('drop', (e) => {
    const files = e.dataTransfer.files;
    if (files.length) {
      fileInput.files = files; // Asigna el archivo al input oculto
      mostrarNombreArchivo(files[0].name);
    }
  });
  // Manejar la selección por clic
  fileInput.addEventListener('change', () => {
    if (fileInput.files.length) {
      mostrarNombreArchivo(fileInput.files[0].name);
    }
  });
  function mostrarNombreArchivo(nombre) {
    fileNameDisplay.textContent = `📌 Archivo listo: ${nombre}`;
  }
</script>
</form>
    </div>
<br>
<br>
</main>

    </div>
    <div class="footer-right">
        <img src="Aerolíneas Malvinas.jpg" class="footer-logo">
    </div>
</footer>
</body>
</html>
