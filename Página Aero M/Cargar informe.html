            <h2>Los mejores envíos del país</h2>

<br>
<br>
<main>
    <div class="container">
        <h2>Cargar Informe</h2>
        
        <form>
            <h3>Informe de Recepción / Despacho</h3>
  <!-- 1. Datos sencillos del informe -->
  <div>
    <label for="numero_vuelo">Número de Vuelo:</label>
    <input type="text" id="numero_vuelo" name="numero_vuelo" placeholder="Ej: 2350" required>
  </div>
<br>
  <div>
    <label for="tipo_operacion">Tipo de Operación:</label>
    <select id="tipo_operacion" name="tipo_operacion" required>
        <option value=""></option>
      <option value="recepcion">Informe de Recepción</option>
      <option value="despacho">Informe de Despacho</option>
    </select>
  </div>
    <br>
    <div>
    <label for="tipo_operacion">Empresa:</label>
    <select id="tipo_operacion" name="tipo_operacion" required>
      <option value="recepcion">TecnoArg</option>
      <option value="despacho">ComputArg</option>
    </select>
  </div>       
  <br> 
  <label for="fecha_llegada">Fecha:</label>
    <input type="date" id="fecha_llegada" name="fecha_llegada" required>
    <br>
    <br>
    <div class="drop-zone" id="drop-zone">
        <div class="drop-zone-icon">📄</div>
        <p class="drop-zone-text">Clickea y subí el informe acá</p>
        <input type="file" id="file-input" name="informe_pdf" accept=".pdf,.doc,.docx" hidden required>
        <div id="file-name" class="file-name"></div> 
    </div>
    <br>
     <button type="submit">Cargar Informe</button>
    
<style>
    .drop-zone {
    border: 2px dashed #0056b3;
    border-radius: 12px;
    padding: 35px 20px;
    text-align: center;
    background-color: #f8f9fa;
    cursor: pointer;
    transition: all 0.3s ease;
    max-width: 500px;
    margin: 20px auto;
  }

  .drop-zone-icon {
    font-size: 40px;
    margin-bottom: 10px;
  }

  .drop-zone-text {
    font-weight: bold;
    font-size: 16px;
    color: #333;
    margin: 0 0 5px 0;
  }

  .file-name {
    margin-top: 15px;
    font-weight: bold;
    color: #28a745;
    font-size: 14px;
  }
</style>

<script>
  const dropZone = document.getElementById('drop-zone');
  const fileInput = document.getElementById('file-input');
  const fileNameDisplay = document.getElementById('file-name');

  // Abrir selector al hacer clic
  dropZone.addEventListener('click', () => fileInput.click());

  ['dragleave', 'drop'].forEach(eventName => {
    dropZone.addEventListener(eventName, (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
    });
  });
  // Manejar el soltado de archivo (drop)
  dropZone.addEventListener('drop', (e) => {
    const files = e.dataTransfer.files;
    if (files.length) {
      fileInput.files = files; // Asigna el archivo al input oculto
      mostrarNombreArchivo(files[0].name);
    }
  });
  // Manejar la selección por clic
  fileInput.addEventListener('change', () => {
    if (fileInput.files.length) {
      mostrarNombreArchivo(fileInput.files[0].name);
    }
  });
  function mostrarNombreArchivo(nombre) {
    fileNameDisplay.textContent = `📌 Archivo listo: ${nombre}`;
  }
</script>
</form>
